<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Quero a maior quantidade de cookies possível!</h1>
    <p>Você tem 🍪<strong id="textoDinheiro" > 0 </strong> </p>  <!--Id é uma tag html, não entra em conflito com o script-->

    <p>Clique no 🍪Cookie para fabricar:</p>

    <img src="../imagens_fodas_backgrounds/cookie.jpg" width="220px" height="250px" onclick="queroCookies()">  
    <!--Isso é necessário para acessar outras pastas em caminhos diferentes, o ../ fiz para ele ir algumas pastas atras, acessar essa pasta e pegar esse arquivo-->
    
    <p><i>Cookies por clique:</i> 🍪<strong id="textoBonus">1</strong></p> 

    <hr/>

    <ul>
        <li> Gotas de chocolate - 🍪<strong id="contagemGotas" > 25 </strong> <button onclick="carrinhoGotas()" > BUFF </button> </li>  
        
        <li> Duplo ou Triplo chocolate - 🍪<strong id="contagemDuplo" > 1000 </strong> <button onclick="carrinhoDuplo()" > BUFF </button> </li>                                     
        
        <li> Chocolate com nozes - 🍪<strong id="contagemNozes" > 50000 </strong> <button onclick="carrinhoNozes()" > BUFF </button> </li>
    </ul>

    <script>  
    
    let cookies_moedas = 0  
    let cookie_por_click = 1
    let contagem_gotas = 25
    let contagem_duplo = 1000
    let contagem_nozes = 50000  
    
        function queroCookies(){ // Ou seja, ao inves de colocar esse variável ser 1 (cookies_moedas) e somar 1+1+1, faço com que o valor que o queroCookies se tornar, entre nessa soma, aumentando o valor por click 
            
            cookies_moedas += cookie_por_click  //Também funciona como um sistema de contagem de variáveis, também existe o -= para retirar valores, sendo uma forma curta de escrever. 
            document.getElementById("textoDinheiro").innerHTML = cookies_moedas  // Esse comando faz exatamente o que diz fazer, ele busca um id nesse html e substitue para o valor que eu quiser.
        }

        // Função do 1º botão (Gotas)
        function carrinhoGotas(){
            if(cookies_moedas < contagem_gotas){
                alert("Farme mais cookies!")
            }else {
                cookie_por_click += 1 // Dá +1 de bônus
                document.getElementById("textoBonus").innerHTML = cookie_por_click
                cookies_moedas -= contagem_gotas 
                document.getElementById("textoDinheiro").innerHTML = cookies_moedas
                contagem_gotas += parseInt (contagem_gotas * 1.30 )
                document.getElementById("contagemGotas").innerHTML = contagem_gotas
            }
        }

        // Função do 2º botão (Duplo ou Triplo)
        function carrinhoDuplo(){
            if(cookies_moedas < contagem_duplo){
                alert("Farme mais cookies!")
            }else {
                cookie_por_click += 10 // Dá +10 de bônus (você pode mudar depois)
                document.getElementById("textoBonus").innerHTML = cookie_por_click
                cookies_moedas -= contagem_duplo  
                document.getElementById("textoDinheiro").innerHTML = cookies_moedas
                contagem_duplo += parseInt (contagem_duplo * 1.30 )
                document.getElementById("contagemDuplo").innerHTML = contagem_duplo
            }
        }

        // Função do 3º botão (Nozes)
        function carrinhoNozes(){
            if(cookies_moedas < contagem_nozes){
                alert("Farme mais cookies!")
            }else {
                cookie_por_click += 100 // Dá +100 de bônus (você pode mudar depois)
                document.getElementById("textoBonus").innerHTML = cookie_por_click
                cookies_moedas -= contagem_nozes  
                document.getElementById("textoDinheiro").innerHTML = cookies_moedas
                contagem_nozes += parseInt (contagem_nozes * 1.30 )
                document.getElementById("contagemNozes").innerHTML = contagem_nozes
            }
        }
    </script>
    
</body>
</html>
